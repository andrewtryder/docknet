name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing Git tag to release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-latest

    steps:
      - name: Resolve and Validate Tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Strict SemVer regex: ^v[0-9]+\.[0-9]+\.[0-9]+$
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Tag '${TAG}' does not match required SemVer format '^v[0-9]+\.[0-9]+\.[0-9]+$'" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Validated Tag:     ${TAG}"
          echo "Validated Version: ${VERSION}"

      - name: Checkout Tagged Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Build Debug Application
        run: make build

      - name: Run Unit Tests
        run: make test-unit

      - name: Build Apple Silicon Release DMG
        run: |
          make release-build \
            VERSION="${{ steps.version.outputs.version }}" \
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Prepare Release Notes Notice
        id: notes
        run: |
          cat << 'EOF' > release_notes.md
          DockNet is currently distributed as an ad-hoc-signed, non-notarized open-source macOS application for Apple Silicon (arm64).

          macOS may block the first launch. If so, use **System Settings -> Privacy & Security -> Open Anyway**.

          SHA-256 checksum is included with the download.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG_PATH="dist/DockNet-${VERSION}-macOS-arm64.dmg"
          CHECKSUM_PATH="dist/DockNet-${VERSION}-macOS-arm64.dmg.sha256"

          if [ ! -f "${DMG_PATH}" ] || [ ! -f "${CHECKSUM_PATH}" ]; then
            echo "ERROR: Release artifacts not found in dist/" >&2
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Updating release assets..."
            gh release upload "${TAG}" "${DMG_PATH}" "${CHECKSUM_PATH}" --clobber
          else
            echo "Creating new release for ${TAG}..."
            gh release create "${TAG}" \
              "${DMG_PATH}" \
              "${CHECKSUM_PATH}" \
              --title "DockNet ${TAG}" \
              --notes "$(cat release_notes.md)" \
              --generate-notes \
              --verify-tag
          fi
