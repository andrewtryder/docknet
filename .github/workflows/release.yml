name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          RAW_TAG="${GITHUB_REF_NAME}"
          if [[ "${RAW_TAG}" =~ ^v[0-9] ]]; then
            VERSION="${RAW_TAG#v}"
            TAG="${RAW_TAG}"
          else
            # For workflow_dispatch on a commit without tag, derive latest tag or fallback
            LATEST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")"
            VERSION="${LATEST_TAG#v}"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved Tag:     ${TAG}"
          echo "Resolved Version: ${VERSION}"

      - name: Build Debug Application
        run: make build

      - name: Run Unit Tests
        run: make test-unit

      - name: Build Universal Release DMG
        run: |
          make release-build \
            VERSION="${{ steps.version.outputs.version }}" \
            BUILD_NUMBER="${GITHUB_RUN_NUMBER}"

      - name: Prepare Release Notes
        id: notes
        run: |
          cat << 'EOF' > release_notes.md
          ### DockNet v${{ steps.version.outputs.version }}

          DockNet is currently distributed as an ad-hoc-signed, non-notarized open-source macOS application.

          macOS may block the first launch. If so, use **System Settings -> Privacy & Security -> Open Anyway**.

          SHA-256 checksum is included with the download.
          EOF

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          DMG_PATH="dist/DockNet-${VERSION}-macOS-universal.dmg"
          CHECKSUM_PATH="dist/DockNet-${VERSION}-macOS-universal.dmg.sha256"

          if [ ! -f "${DMG_PATH}" ] || [ ! -f "${CHECKSUM_PATH}" ]; then
            echo "ERROR: Release artifacts not found in dist/" >&2
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists. Updating release assets..."
            gh release upload "${TAG}" "${DMG_PATH}" "${CHECKSUM_PATH}" --clobber
          else
            echo "Creating new release for ${TAG}..."
            gh release create "${TAG}" \
              "${DMG_PATH}" \
              "${CHECKSUM_PATH}" \
              --title "DockNet ${TAG}" \
              --notes-file release_notes.md \
              --generate-notes
          fi
