<svg
    xmlns="http://www.w3.org/2000/svg"
    width="96"
    height="96"
    viewBox="0 0 24 24"
    fill="none">
    <style>
        .docknet-stroke { stroke: #1D1D1F; }
        .docknet-fill { fill: #1D1D1F; }
        @media (prefers-color-scheme: dark) {
            .docknet-stroke { stroke: #F5F5F7; }
            .docknet-fill { fill: #F5F5F7; }
        }
    </style>

    <!-- Ethernet / RJ45 connector -->
    <path
        class="docknet-stroke"
        d="M6 3.5
           H18
           V5
           H20
           V10.5
           H17.5
           V12.5
           H6.5
           V10.5
           H4
           V5
           H6
           Z"
        stroke-width="2"
        stroke-linejoin="round"/>

    <!-- connector contacts -->
    <path
        class="docknet-stroke"
        d="M8 4.2V7
           M10.7 4.2V7
           M13.3 4.2V7
           M16 4.2V7"
        stroke-width="1.4"
        stroke-linecap="round"/>

    <!-- Wi-Fi / fallback path -->
    <path
        class="docknet-stroke"
        d="M6.5 15.5
           C9.7 12.9 14.3 12.9 17.5 15.5"
        stroke-width="2"
        stroke-linecap="round"/>

    <path
        class="docknet-stroke"
        d="M9 18
           C10.7 16.6 13.3 16.6 15 18"
        stroke-width="2"
        stroke-linecap="round"/>

    <circle
        class="docknet-fill"
        cx="12"
        cy="20.5"
        r="1.2"/>
</svg>
